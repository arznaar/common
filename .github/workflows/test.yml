on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-integration:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'WIP')"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run test
